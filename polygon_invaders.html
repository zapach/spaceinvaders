<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polygon Invaders</title><style>html,body{margin:0;height:100%;background:#050712;color:white;font-family:system-ui}body{display:grid;place-items:center}#g{position:relative;width:min(900px,100vw);height:100vh}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800}</style></head><body><div id="g"><canvas id="c"></canvas><div id="hud"><span id="l"></span><span id="s"></span><span id="v"></span></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),L=document.querySelector('#l'),S=document.querySelector('#s'),V=document.querySelector('#v');let W,H,level=1,score=0,lives=3,running=true,last=0,shots=[],foes=[],enemyShots=[],keys={};const p={x:0,y:0};
function size(){W=c.width=c.clientWidth*devicePixelRatio;H=c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=c.clientWidth;H=c.clientHeight;p.y=H-55;p.x=p.x||W/2}addEventListener('resize',size);size();
function sides(){return Math.min(12,level+2)}function poly(X,Y,r,n){x.beginPath();for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n;x.lineTo(X+Math.cos(a)*r,Y+Math.sin(a)*r)}x.closePath()}
function wave(){foes=[];let n=sides(),cols=Math.min(9,Math.max(5,Math.floor(W/70))),rows=Math.min(5,2+Math.floor(level/2)),gap=Math.min(65,(W-60)/(cols-1)),st=(W-gap*(cols-1))/2;for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)foes.push({x:st+q*gap,y:70+r*48,n,hp:n});update()}
function update(){L.textContent=`LEVEL ${level} • ${sides()} SIDES`;S.textContent=`SCORE ${score}`;V.textContent=`LIVES ${lives}`}
function fire(){shots.push({x:p.x,y:p.y-18})}wave();let cool=0;
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('pointermove',e=>p.x=e.clientX-c.getBoundingClientRect().left);
function hitlife(){lives--;if(lives<=0){running=false;alert('Game over! Score: '+score);location.reload()}update()}
function tick(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(running){if(keys.a||keys.arrowleft)p.x-=360*dt;if(keys.d||keys.arrowright)p.x+=360*dt;p.x=Math.max(20,Math.min(W-20,p.x));cool-=dt;while(cool<=0){fire();cool+=.1}shots.forEach(a=>a.y-=650*dt);shots=shots.filter(a=>a.y>-20);let drift=Math.sin(t*.0008)*18;foes.forEach(e=>{e.x+=drift*dt;e.y+=(8+level*1.5)*dt;if(e.y>H-100){e.y=55;hitlife()}});if(Math.random()<dt*(.35+level*.04)&&foes.length){let e=foes[Math.floor(Math.random()*foes.length)];enemyShots.push({x:e.x,y:e.y+18})}enemyShots.forEach(a=>a.y+=(170+level*10)*dt);enemyShots=enemyShots.filter(a=>a.y<H+20);for(let a of shots){for(let i=0;i<foes.length;i++){let e=foes[i],dx=a.x-e.x,dy=a.y-e.y;if(dx*dx+dy*dy<26*26){a.y=-999;e.hp--;e.n=e.hp;score+=10;if(e.hp<=0){score+=e.n*10;foes.splice(i,1)}break}}}for(let a of enemyShots){if(Math.abs(a.x-p.x)<22&&Math.abs(a.y-p.y)<20){a.y=999;hitlife()}}if(!foes.length){level++;wave()}update()}x.clearRect(0,0,W,H);x.fillStyle='#080d1d';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let i=0;i<70;i++)x.fillRect((i*83)%W,(i*137)%H,1,1);x.strokeStyle='#eaf2ff';x.lineWidth=2;x.beginPath();x.moveTo(p.x,p.y-14);x.lineTo(p.x-22,p.y+10);x.lineTo(p.x+22,p.y+10);x.closePath();x.stroke();for(let e of foes){x.strokeStyle='#79b8ff';poly(e.x,e.y,17,e.n);x.stroke()}x.fillStyle='#fff';shots.forEach(a=>x.fillRect(a.x-1,a.y-7,2,14));x.fillStyle='#ff7777';enemyShots.forEach(a=>{x.beginPath();x.arc(a.x,a.y,4,0,7);x.fill()});requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
